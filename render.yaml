services:
  - type: web
    name: drowning-watch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn drowning_watch.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/drowning-watch-data
      - key: UPLOAD_DIR
        value: /tmp/drowning-watch-data/uploads
      - key: OUTPUT_DIR
        value: /tmp/drowning-watch-data/outputs
      - key: DATABASE_URL
        value: sqlite:////tmp/drowning-watch-data/drowning_watch.db
      - key: YOLO_MODEL
        value: backend/drowning_watch/assets/best.pt
      - key: POSE_MODEL
        value: /tmp/drowning-watch-data/pose_landmarker.task
      - key: RISK_MODEL
        value: /tmp/drowning-watch-data/risk_model.joblib
      - key: POSE_ENABLED
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_ALLOWED_EMAILS
        sync: false
