[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drowning-watch"
version = "0.1.0"
description = "Research prototype for swimming-pool video monitoring"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
